aid: silicon-box
name: Silicon Box
description: >-
  Silicon Box Pte Ltd is an independent advanced semiconductor packaging and
  chiplet integration company headquartered in Tampines, Singapore, founded in
  2021 by Byung Joon Han, Sehat Sutardja and Weili Dai. It operates a $2B
  panel-level packaging foundry and provides the back-end interconnection
  infrastructure that makes chiplet adoption practical — from early design
  collaboration through final manufacture and test — functioning as an OSAT
  with an added design-consulting practice. It has shipped over 500 million
  units at high yield, joined the imec Automotive Chiplet Program, and is
  building a second €3.2B facility in Novara, Piedmont, Italy. Silicon Box is
  a semiconductor manufacturer, not a software vendor: it publishes no
  developer program, no API documentation and no machine-readable API
  contract. See x-coverage below for the measured basis of that statement.
